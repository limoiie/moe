<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moe</title>
  </head>
  <body class="bg-transparent">
    <div
      id="root"
      class="relative m-3 flex h-[calc(100vh-1.5rem)] flex-col overflow-hidden rounded-2xl border border-zinc-700/60 bg-zinc-900/90 shadow-2xl backdrop-blur-xl"
    >
      <input
        id="query"
        class="w-full bg-transparent px-4 pt-4 pb-3 text-lg text-zinc-100 placeholder-zinc-500 outline-none"
        placeholder="搜索 Command…"
        autofocus
        spellcheck="false"
      />
      <div
        id="banner"
        class="hidden items-center justify-between gap-3 border-b border-amber-500/30 bg-amber-500/10 px-4 py-2 text-xs text-amber-200"
      >
        <span id="banner-text"></span>
        <button
          id="banner-action"
          class="shrink-0 rounded-md border border-amber-400/40 px-2 py-1 text-amber-100 hover:bg-amber-400/20"
        >
          打开系统设置
        </button>
      </div>
      <div id="attach" class="hidden">
        <span id="attach-text"></span>
      </div>
      <div id="detail" class="md hidden"></div>
      <ul id="list" class="min-h-0 flex-1 overflow-y-auto px-2 pb-2"></ul>
      <div
        id="toast"
        class="pointer-events-none absolute bottom-12 left-1/2 hidden -translate-x-1/2 rounded-full border border-zinc-600/60 bg-zinc-800/90 px-3 py-1 text-xs text-zinc-100 shadow-lg"
      ></div>
      <footer
        id="hints"
        class="flex flex-wrap items-center gap-x-4 gap-y-1 border-t border-zinc-800 px-4 py-2 text-xs text-zinc-400"
      ></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
