name: Release

# Manually (Actions page) or on a v* tag push: build the macOS .app/.dmg and upload artifacts.
# No signing/notarization: first open needs right-click → "Open" (see README "Install").
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # tauri-action installs tauri-cli and runs `cargo tauri build` (frontend artifacts embedded)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/moe-app
          args: --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: moe-macos-dmg-${{ github.sha }}
          path: "**/target/release/bundle/dmg/*.dmg"
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: moe-macos-app-${{ github.sha }}
          path: "**/target/release/bundle/macos/Moe.app"
          if-no-files-found: error
