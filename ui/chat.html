<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moe Chat</title>
  </head>
  <body class="bg-transparent">
    <div
      id="root"
      class="moe-window-card relative m-2 flex h-[calc(100vh-1rem)] flex-col overflow-hidden rounded-2xl border border-zinc-700/60 bg-zinc-900/95 backdrop-blur-xl"
    >
      <header
        data-tauri-drag-region
        class="flex items-center justify-between gap-2 border-b border-zinc-800 px-4 py-2 text-sm text-zinc-300"
      >
        <span data-tauri-drag-region class="flex min-w-0 flex-1 items-center gap-2">
          <span id="chat-icon" class="text-zinc-500"></span>
          <span id="chat-title" data-tauri-drag-region class="min-w-0 truncate font-medium">
            AI Chat
          </span>
        </span>
        <div class="flex shrink-0 items-center gap-0.5">
          <button
            id="actions-button"
            title="More Actions"
            class="rounded-md p-1.5 text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
          ></button>
          <button
            id="history-button"
            title="Chat History"
            class="rounded-md p-1.5 text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
          ></button>
          <button
            id="new-chat"
            title="New Chat"
            class="rounded-md p-1.5 text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
          ></button>
          <button
            id="close"
            title="Hide (Esc)"
            class="rounded-md p-1.5 text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
          ></button>
        </div>
      </header>

      <main id="messages" class="min-h-0 flex-1 space-y-4 overflow-y-auto px-4 py-4"></main>
      <div id="empty" class="hidden px-4 pb-2 text-xs text-zinc-500"></div>
      <div
        id="error"
        class="hidden border-t border-red-500/30 bg-red-500/10 px-4 py-2 text-xs text-red-200"
      ></div>
      <div id="attach-row" class="hidden">
        <input
          id="attach-path"
          class="min-w-0 flex-1 bg-transparent text-zinc-100 placeholder-zinc-500 outline-none"
          placeholder="Paste a file path, Enter to attach (Esc cancels; ~ and paths with spaces supported)"
          spellcheck="false"
        />
        <span id="attach-msg" class="shrink-0"></span>
      </div>
      <footer class="border-t border-zinc-800 p-2">
        <textarea
          id="composer"
          rows="3"
          placeholder="Continue the conversation… (Enter to send, Shift+Enter for a new line)"
          spellcheck="false"
          class="w-full resize-none bg-transparent px-2 py-1 text-sm text-zinc-100 placeholder-zinc-500 outline-none"
        ></textarea>
        <div class="flex items-center justify-between px-1">
          <button
            id="attach"
            class="flex items-center gap-1 rounded-md px-2 py-1 text-xs text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
            title="Add attachment (path input)"
          ></button>
          <button id="send" class="flex items-center gap-1 rounded-md px-3 py-1 text-xs"></button>
        </div>
      </footer>

      <!-- Floating history card (centered at the top; open via the history button / ⌘P) -->
      <div
        id="history-card"
        class="absolute left-1/2 top-12 z-30 hidden w-96 -translate-x-1/2 overflow-hidden rounded-xl border border-zinc-700/60 bg-zinc-900/95 shadow-2xl backdrop-blur-xl"
      >
        <input
          id="history-search"
          class="w-full border-b border-zinc-800 bg-transparent px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 outline-none"
          placeholder="Search chat history…"
          spellcheck="false"
        />
        <ul id="history-list" class="max-h-80 overflow-y-auto p-1"></ul>
      </div>

      <!-- More Actions menu (⌘ button / ⌘⇧P) -->
      <div
        id="actions-menu"
        class="absolute right-3 top-11 z-30 hidden w-52 overflow-hidden rounded-xl border border-zinc-700/60 bg-zinc-900/95 p-1 shadow-2xl backdrop-blur-xl"
      ></div>

      <div
        id="toast"
        class="pointer-events-none absolute bottom-4 left-1/2 hidden -translate-x-1/2 items-center gap-1.5 rounded-full border border-zinc-600/60 bg-zinc-800/90 px-3 py-1 text-xs text-zinc-100 shadow-lg"
      >
        <span id="toast-icon"></span>
        <span id="toast-text"></span>
      </div>
    </div>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
