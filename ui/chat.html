<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moe Chat</title>
    <script>
      /* Seed the appearance from the OS before the first paint (styles.css); theme.ts applies
         the config override ([ui] theme) as soon as the backend answers. */
      document.documentElement.dataset.theme = window.matchMedia?.(
        "(prefers-color-scheme: dark)",
      )?.matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body class="bg-transparent">
    <div
      id="root"
      class="moe-window-card relative m-2 flex h-[calc(100vh-1rem)] flex-col overflow-hidden rounded-window bg-surface"
    >
      <header
        data-tauri-drag-region
        class="flex items-center justify-between gap-2 border-b border-line px-4 py-1.5 text-sm text-fg-muted"
      >
        <span data-tauri-drag-region class="flex min-w-0 flex-1 items-center gap-2">
          <span id="chat-icon" class="text-fg-subtle"></span>
          <span id="chat-title" data-tauri-drag-region class="min-w-0 truncate font-medium">
            AI Chat
          </span>
        </span>
        <!-- Window controls: standalone circular glass buttons, Siri-style -->
        <div class="flex shrink-0 items-center gap-1.5">
          <button id="actions-button" class="moe-glass-button" title="More Actions"></button>
          <button id="history-button" class="moe-glass-button" title="Chat History"></button>
          <button id="new-chat" class="moe-glass-button" title="New Chat"></button>
          <button id="close" class="moe-glass-button" title="Hide (Esc)"></button>
        </div>
      </header>

      <main id="messages" class="moe-scroll-fade min-h-0 flex-1 space-y-4 overflow-y-auto px-4 py-4"></main>
      <div id="empty" class="hidden px-4 pb-2 text-xs text-fg-subtle"></div>
      <div
        id="error"
        class="hidden border-t border-danger-line bg-danger-soft px-4 py-2 text-xs text-danger"
      ></div>
      <div id="attach-row" class="hidden">
        <input
          id="attach-path"
          class="min-w-0 flex-1 bg-transparent text-fg caret-accent placeholder-fg-subtle outline-none"
          placeholder="Paste a file path, Enter to attach (Esc cancels; ~ and paths with spaces supported)"
          spellcheck="false"
        />
        <span id="attach-msg" class="shrink-0"></span>
      </div>
      <footer class="border-t border-line p-2">
        <textarea
          id="composer"
          rows="3"
          placeholder="Continue the conversation… (Enter to send, Shift+Enter for a new line)"
          spellcheck="false"
          class="w-full resize-none rounded-xl border border-line bg-transparent px-2.5 py-1.5 text-sm text-fg caret-accent placeholder-fg-subtle outline-none transition-colors focus:border-accent-line"
        ></textarea>
        <div class="flex items-center justify-between px-1">
          <button
            id="attach"
            class="moe-focus-ring flex items-center gap-1 rounded-full px-2.5 py-1 text-xs text-fg-muted transition-colors hover:bg-surface-hover hover:text-fg active:bg-surface-selected"
            title="Add attachment (path input)"
          ></button>
          <button id="send" class="flex items-center gap-1 rounded-md px-3 py-1 text-xs"></button>
        </div>
      </footer>

      <!-- Floating history card (centered at the top; open via the history button / ⌘P) -->
      <div
        id="history-card"
        class="moe-actions-card absolute left-1/2 top-12 z-30 hidden w-96 -translate-x-1/2 overflow-hidden rounded-2xl bg-surface-overlay"
      >
        <input
          id="history-search"
          class="w-full border-b border-line bg-transparent px-3 py-2 text-sm text-fg caret-accent placeholder-fg-subtle outline-none"
          placeholder="Search chat history…"
          spellcheck="false"
        />
        <ul id="history-list" class="moe-scroll-fade max-h-80 overflow-y-auto p-1"></ul>
      </div>

      <!-- More Actions card (the ⌘ button / ⌘⇧P): the same card as the panel's actions card —
           sections + filter input (ADR-0028). The Side View anchors it horizontally centered, near
           the top (like the history card), with the input at the top edge. -->
      <div
        id="actions-card"
        class="moe-actions-card absolute left-1/2 top-12 z-30 hidden w-80 -translate-x-1/2 overflow-hidden rounded-2xl bg-surface-overlay"
      >
        <input
          id="action-search"
          class="w-full border-b border-line bg-transparent px-3 py-2 text-sm text-fg caret-accent placeholder-fg-subtle outline-none"
          placeholder="Filter actions…"
          spellcheck="false"
        />
        <ul id="action-list" class="max-h-72 overflow-y-auto p-1"></ul>
      </div>

      <div
        id="toast"
        class="moe-bubble pointer-events-none absolute bottom-4 left-1/2 hidden -translate-x-1/2 items-center gap-1.5 rounded-full bg-surface-float px-3 py-1 text-xs text-fg"
      >
        <span id="toast-icon"></span>
        <span id="toast-text"></span>
      </div>
    </div>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
