<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moe Settings</title>
    <script>
      /* Seed the appearance from the OS before the first paint (styles.css); theme.ts applies
         the config override ([ui] theme) as soon as the backend answers. */
      document.documentElement.dataset.theme = window.matchMedia?.(
        "(prefers-color-scheme: dark)",
      )?.matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body class="bg-surface">
    <!-- Settings window (MOE-0029): an ordinary macOS window — the native title bar carries the
         close / minimize / maximize buttons — with the app's own two-pane layout inside:
         sidebar sections on the left, the section pane on the right. The window hides on close
         (it is a singleton, reopened from the tray / palette / Side View gear). -->
    <div id="root" class="flex h-screen w-screen overflow-hidden bg-surface">
      <aside class="flex w-56 shrink-0 flex-col border-r border-line px-3 pb-4 pt-3">
        <div class="mb-3 flex h-7 shrink-0 items-center px-1">
          <span class="truncate text-sm font-semibold text-fg">Settings</span>
        </div>
        <nav id="nav" class="flex flex-col gap-0.5"></nav>
        <div class="mt-auto px-1 pt-4 text-[11px] leading-relaxed text-fg-subtle">
          Providers and keys also live in config.toml — the file stays the escape hatch.
        </div>
      </aside>
      <main id="pane" class="moe-scroll-fade min-w-0 flex-1 overflow-y-auto px-6 py-5"></main>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
