<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moe</title>
  </head>
  <body class="bg-transparent">
    <div
      id="root"
      class="moe-window-card relative m-3 flex h-[calc(100vh-1.5rem)] flex-col overflow-hidden rounded-2xl border border-zinc-700/60 bg-zinc-900/90 backdrop-blur-xl"
    >
      <div class="flex items-center gap-2.5 px-5 pt-4 pb-3">
        <span id="input-icon" class="text-zinc-500"></span>
        <input
          id="query"
          class="w-full bg-transparent text-sm text-zinc-100 placeholder-zinc-500 outline-none"
          placeholder="搜索 Command…"
          autofocus
          spellcheck="false"
        />
      </div>
      <div
        id="banner"
        class="hidden items-center justify-between gap-3 border-b border-amber-500/30 bg-amber-500/10 px-4 py-2 text-xs text-amber-200"
      >
        <span class="flex min-w-0 items-center gap-2">
          <span id="banner-icon"></span>
          <span id="banner-text"></span>
        </span>
        <button
          id="banner-action"
          class="shrink-0 rounded-md border border-amber-400/40 px-2 py-1 text-amber-100 hover:bg-amber-400/20"
        >
          打开系统设置
        </button>
      </div>
      <div id="attach" class="hidden">
        <span id="attach-text"></span>
      </div>
      <div class="flex min-h-0 flex-1">
        <ul id="list" class="min-h-0 flex-1 overflow-y-auto px-2 pb-12"></ul>
        <div id="detail" class="md hidden"></div>
      </div>
      <div
        id="toast"
        class="pointer-events-none absolute bottom-16 left-1/2 hidden -translate-x-1/2 items-center gap-1.5 rounded-full border border-zinc-600/60 bg-zinc-800/90 px-3 py-1 text-xs text-zinc-100 shadow-lg"
      >
        <span id="toast-icon"></span>
        <span id="toast-text"></span>
      </div>
      <!-- 动作面板（⌘K / ⌘⇧P）：浮层卡片，输入 + 过滤后的动作列表，不替换主体 -->
      <div
        id="actions-card"
        class="moe-actions-card absolute bottom-14 right-2 z-20 hidden w-80 overflow-hidden rounded-xl border border-zinc-700/60 bg-zinc-900/95 backdrop-blur-xl"
      >
        <input
          id="action-search"
          class="w-full border-b border-zinc-800 bg-transparent px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 outline-none"
          placeholder="筛选动作…"
          spellcheck="false"
        />
        <ul id="action-list" class="max-h-72 overflow-y-auto p-1"></ul>
      </div>

      <!-- 悬浮动作条（Raycast 同款）：主操作 + 动作，同一个胶囊；距右/下边缘 8px -->
      <div id="action-bar" class="moe-action-bar absolute bottom-2 right-2 z-10"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
