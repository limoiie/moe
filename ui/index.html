<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moe</title>
    <script>
      /* Seed the appearance from the OS before the first paint (styles.css); theme.ts applies
         the config override ([ui] theme) as soon as the backend answers. */
      document.documentElement.dataset.theme = window.matchMedia?.(
        "(prefers-color-scheme: dark)",
      )?.matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body class="bg-transparent">
    <div
      id="root"
      class="moe-window-card relative m-3 flex h-[calc(100vh-1.5rem)] flex-col overflow-hidden rounded-window bg-surface pb-2"
    >
      <div id="query-row" class="relative flex items-center gap-2.5 px-5 pt-4 pb-3">
        <span id="input-icon" class="moe-input-icon text-fg-subtle"></span>
        <div class="flex min-w-0 flex-1 flex-col">
          <input
            id="query"
            class="moe-query-input w-full bg-transparent text-sm text-fg caret-accent placeholder-fg-subtle outline-none"
            placeholder="Search commands…"
            autofocus
            spellcheck="false"
          />
          <!-- Chat page subtitle (MOE-0033): the active provider · model under the conversation
               title, smaller and muted; hidden on every other page. -->
          <span id="query-subtitle" class="hidden truncate text-[11px] leading-4 text-fg-subtle"></span>
        </div>
        <!-- Filter Control (ADR-0043): the result page's second filtering dimension — label + chevron,
             showing the active value when one is set. Hidden unless the result declares one, and sized
             inside the row band so the measured panel height never moves (ADR-0043's height invariant). -->
        <button id="filter-control" class="moe-filter-control hidden" type="button"></button>
        <!-- Palette search in flight (ADR-0043): a hairline at the input row's bottom edge. It lives
             *inside* the row and out of flow, so it costs no layout at all — the list must not move
             when a search starts (MOE-0055) — and its visibility timing (delayed, minimum-visible)
             lives in ui/src/loading.ts. Stale rows stay visible while it shows. -->
        <div id="loading-bar" class="moe-loading-bar hidden"></div>
      </div>
      <!-- Chat page (MOE-0030 revision): the Input Bar above reads the conversation title
           (read-only, same design as the command pages), and the composer row at the bottom
           wears the root page's bottom-bar glass: add button · capsule input · actions button. -->
      <div
        id="banner"
        class="hidden items-center justify-between gap-3 border-b border-warning-line bg-warning-soft px-4 py-2 text-xs text-warning"
      >
        <span class="flex min-w-0 items-center gap-2">
          <span id="banner-icon"></span>
          <span id="banner-text"></span>
        </span>
        <button
          id="banner-action"
          class="moe-focus-ring shrink-0 rounded-full border border-warning-line px-2.5 py-1 text-warning transition-colors hover:bg-warning/15 active:bg-warning/25"
        >
          Open System Settings
        </button>
      </div>
      <div id="attach" class="hidden">
        <span id="attach-text"></span>
      </div>
      <div class="flex min-h-0 flex-1">
        <ul id="list" class="moe-scroll-fade min-h-0 flex-1 overflow-y-auto px-2"></ul>
        <div id="detail" class="md moe-scroll-fade hidden"></div>
      </div>

      <!-- Chat page composer (MOE-0030): the shared pill (attach · draft · send) at the bottom of
           the Quick Ask page, mounted by composer.ts; hidden on every other page. -->
      <footer id="chat-composer" class="hidden shrink-0 px-2 pt-1"></footer>

      <!-- Bottom bar (ADR-0026): exactly one row tall, overlaying the list's last visible row band.
           Left: the avatar chip — Moe's avatar on the command layer, the Extension's icon + name
           inside a command; it doubles as the toast host and opens the About card.
           Right: the action pill (primary action + actions). -->
      <div
        id="bottom-bar"
        class="moe-bottom-bar pointer-events-none absolute inset-x-0 bottom-2 z-10 flex items-center justify-between pl-2 pr-2"
      >
        <button id="avatar-chip" class="moe-avatar-chip" title="About Moe"></button>
        <div id="action-bar" class="moe-action-bar"></div>
      </div>

      <!-- About card (ADR-0026): the avatar chip's menu — same UX as the actions card: rows grouped
           into sections (App / Support), the search input at the bottom -->
      <div
        id="about-card"
        class="moe-about-card absolute bottom-14 left-2 z-20 hidden w-80 overflow-hidden rounded-2xl bg-surface-overlay"
      >
        <ul id="about-list" class="max-h-72 overflow-y-auto p-1"></ul>
        <input
          id="about-search"
          class="w-full border-t border-line bg-transparent px-3 py-2 text-sm text-fg caret-accent placeholder-fg-subtle outline-none"
          placeholder="Search…"
          spellcheck="false"
        />
      </div>

      <!-- Stop-generation confirmation (ADR-0036): back on the Quick Ask page while an answer is
           streaming — ⏎ stops, Esc keeps generating. -->
      <div
        id="confirm-card"
        class="moe-actions-card absolute left-1/2 top-1/2 z-30 hidden w-80 -translate-x-1/2 -translate-y-1/2 overflow-hidden rounded-2xl bg-surface-overlay"
      >
        <div id="confirm-text" class="px-4 pt-3.5 pb-3 text-sm text-fg"></div>
        <div class="flex justify-end gap-2 px-3 pb-3">
          <button
            id="confirm-cancel"
            class="moe-focus-ring flex items-center gap-1.5 rounded-full px-3 py-1 text-xs text-fg-muted transition-colors hover:bg-surface-hover hover:text-fg active:bg-surface-selected"
          ></button>
          <button
            id="confirm-ok"
            class="moe-focus-ring flex items-center gap-1.5 rounded-full bg-warning-fill px-3 py-1 text-xs text-on-warning transition-colors hover:bg-warning-fill-hover"
          ></button>
        </div>
      </div>

      <!-- Actions card (⌘K / ⌘⇧P): floating card that never replaces the body — grouped action list
           (sections), the filter input at the bottom, same card language as the About card -->
      <div
        id="actions-card"
        class="moe-actions-card absolute bottom-14 right-2 z-20 hidden w-80 overflow-hidden rounded-2xl bg-surface-overlay"
      >
        <ul id="action-list" class="max-h-72 overflow-y-auto p-1"></ul>
        <input
          id="action-search"
          class="w-full border-t border-line bg-transparent px-3 py-2 text-sm text-fg caret-accent placeholder-fg-subtle outline-none"
          placeholder="Filter actions…"
          spellcheck="false"
        />
      </div>

      <!-- Filter Card (ADR-0043): the Filter Control's menu, anchored under its trigger (ADR-0028's
           anchor-follows-trigger rule). Rows are the dimension's values plus a platform-supplied reset;
           the input sits at the bottom edge like every other menu card. -->
      <div
        id="filter-card"
        class="moe-filter-card absolute right-2 top-14 z-30 hidden w-64 overflow-hidden rounded-2xl bg-surface-overlay"
      >
        <ul id="filter-list" class="max-h-72 overflow-y-auto p-1"></ul>
        <input
          id="filter-search"
          class="w-full border-t border-line bg-transparent px-3 py-2 text-sm text-fg caret-accent placeholder-fg-subtle outline-none"
          placeholder="Filter values…"
          spellcheck="false"
        />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
