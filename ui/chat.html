<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moe Chat</title>
  </head>
  <body class="bg-transparent">
    <div
      id="root"
      class="m-2 flex h-[calc(100vh-1rem)] flex-col overflow-hidden rounded-2xl border border-zinc-700/60 bg-zinc-900/95 shadow-2xl backdrop-blur-xl"
    >
      <header
        data-tauri-drag-region
        class="flex items-center justify-between border-b border-zinc-800 px-4 py-2 text-sm text-zinc-300"
      >
        <span data-tauri-drag-region class="font-medium">Moe · AI 对话</span>
        <button
          id="close"
          class="rounded-md px-2 py-0.5 text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
          title="收起（Esc）"
        >
          ✕
        </button>
      </header>
      <div id="empty" class="hidden px-4 pb-1 pt-3 text-xs text-zinc-500"></div>
      <main id="history" class="min-h-0 flex-1 space-y-4 overflow-y-auto px-4 py-4"></main>
      <div
        id="error"
        class="hidden border-t border-red-500/30 bg-red-500/10 px-4 py-2 text-xs text-red-200"
      ></div>
      <footer class="border-t border-zinc-800 p-2">
        <textarea
          id="composer"
          rows="3"
          placeholder="继续对话…（Enter 发送，Shift+Enter 换行）"
          spellcheck="false"
          class="w-full resize-none bg-transparent px-2 py-1 text-sm text-zinc-100 placeholder-zinc-500 outline-none"
        ></textarea>
        <div class="flex items-center justify-between px-1">
          <button
            id="attach"
            disabled
            title="附件：IIE4AD-358 接入"
            class="cursor-not-allowed rounded-md px-2 py-1 text-xs text-zinc-500"
          >
            📎 附件
          </button>
          <button
            id="send"
            class="rounded-md bg-sky-600 px-3 py-1 text-xs text-white hover:bg-sky-500"
          >
            发送 ⏎
          </button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
