<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moe Chat</title>
    <script>
      /* Seed the appearance from the OS before the first paint (styles.css); theme.ts applies
         the config override ([ui] theme) as soon as the backend answers. */
      document.documentElement.dataset.theme = window.matchMedia?.(
        "(prefers-color-scheme: dark)",
      )?.matches
        ? "dark"
        : "light";
      /* macOS carries this window's frost as a native, active-pinned material behind the webview
         (moe-platform::mac::install_side_view_material); the stylesheet drops its backdrop-filter
         there so the two blurs don't stack. Only this page sets the attribute. */
      if (navigator.userAgent.includes("Mac")) {
        document.documentElement.dataset.platform = "macos";
      }
    </script>
  </head>
  <body class="bg-transparent">
    <div
      id="root"
      class="moe-window-card relative m-2 flex h-[calc(100vh-1rem)] flex-col overflow-hidden rounded-2xl bg-surface"
    >
      <!-- Titlebar: the traffic-light trio on the left, the title centered in the bar, the icon
           actions in a glass capsule on the right (the whole strip is draggable). The chrome follows
           the pointer and the window's focus (styles.css, body.moe-pointer-inside / .moe-window-focused). -->
      <header
        data-tauri-drag-region
        class="moe-titlebar relative flex h-10 shrink-0 items-center justify-between gap-2 pl-4 pr-1.5 text-sm text-fg-muted"
      >
        <div class="moe-traffic-lights moe-titlebar-reveal shrink-0">
          <button
            id="win-hide"
            class="moe-traffic-light moe-focus-ring"
            data-tone="close"
            title="Hide (Esc)"
            aria-label="Hide"
          ></button>
          <button
            id="win-compact"
            class="moe-traffic-light moe-focus-ring"
            data-tone="compact"
            title="Shrink width"
            aria-label="Shrink width"
          ></button>
          <button
            id="win-expand"
            class="moe-traffic-light moe-focus-ring"
            data-tone="expand"
            title="Expand width"
            aria-label="Expand width"
          ></button>
        </div>
        <div
          data-tauri-drag-region
          class="absolute left-1/2 flex max-w-[45%] -translate-x-1/2 flex-col items-center"
        >
          <span
            id="chat-title"
            data-tauri-drag-region
            class="moe-titlebar-title max-w-full truncate font-medium"
          >
            AI Chat
          </span>
          <!-- The active pair under the title (MOE-0033): smaller and muted; hidden when unset. -->
          <span
            id="chat-model"
            data-tauri-drag-region
            class="hidden max-w-full truncate text-[11px] leading-4 text-fg-subtle"
          ></span>
        </div>
        <div class="moe-window-actions moe-titlebar-reveal shrink-0">
          <button id="history-button" class="moe-focus-ring" title="Chat History"></button>
          <button id="new-chat" class="moe-focus-ring" title="New Chat"></button>
          <button id="settings-button" class="moe-focus-ring" title="Settings"></button>
        </div>
      </header>

      <main id="messages" class="moe-scroll-fade min-h-0 flex-1 space-y-4 overflow-y-auto px-4 py-4"></main>
      <div id="empty" class="hidden px-4 pb-2 text-xs text-fg-subtle"></div>
      <div
        id="error"
        class="hidden border-t border-danger-line bg-danger-soft px-4 py-2 text-xs text-danger"
      ></div>

      <!-- Composer (MOE-0030): the shared pill (attach · draft · send) mounted by composer.ts —
           the same component the panel's Quick Ask page uses, so the two surfaces stay identical. -->
      <footer id="composer-host" class="shrink-0 px-2 pb-2 pt-1"></footer>

      <!-- Floating history card (centered at the top; open via the history button / ⌘P). Like
           every menu card the filter input sits at the bottom (ADR-0028 amendment). -->
      <div
        id="history-card"
        class="moe-actions-card absolute left-1/2 top-12 z-30 hidden w-[min(24rem,calc(100%-2.5rem))] -translate-x-1/2 overflow-hidden rounded-2xl bg-surface-overlay"
      >
        <ul id="history-list" class="moe-scroll-fade max-h-80 overflow-y-auto p-1"></ul>
        <input
          id="history-search"
          class="w-full border-t border-line bg-transparent px-3 py-2.5 text-sm text-fg caret-accent placeholder-fg-subtle outline-none"
          placeholder="Search chat history…"
          spellcheck="false"
        />
      </div>

      <!-- More Actions card (the ⌘ button / ⌘K): the same card as the panel's actions card —
           sections in the canonical order, rank groups hairline-separated inside a section
           (ADR-0037 amendment) + filter input (ADR-0028). The Side View anchors it horizontally
           centered, near the top (like the history card), with the input at the top edge. -->
      <div
        id="actions-card"
        class="moe-actions-card absolute left-1/2 top-12 z-30 hidden w-[min(20rem,calc(100%-2.5rem))] -translate-x-1/2 overflow-hidden rounded-2xl bg-surface-overlay"
      >
        <ul id="action-list" class="max-h-72 overflow-y-auto p-1"></ul>
        <input
          id="action-search"
          class="w-full border-t border-line bg-transparent px-3 py-2.5 text-sm text-fg caret-accent placeholder-fg-subtle outline-none"
          placeholder="Filter actions…"
          spellcheck="false"
        />
      </div>

      <div
        id="toast"
        class="moe-bubble pointer-events-none absolute bottom-4 left-1/2 hidden -translate-x-1/2 items-center gap-1.5 rounded-full bg-surface-float px-3 py-1 text-xs text-fg"
      >
        <span id="toast-icon"></span>
        <span id="toast-text"></span>
      </div>
    </div>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
