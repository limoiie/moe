<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moe Chat</title>
  </head>
  <body class="bg-transparent">
    <div
      id="root"
      class="m-2 flex h-[calc(100vh-1rem)] overflow-hidden rounded-2xl border border-zinc-700/60 bg-zinc-900/95 shadow-2xl backdrop-blur-xl"
    >
      <!-- 左栏：历史会话（默认隐藏，⌘B 切换 / 头部时钟按钮悬停下拉） -->
      <aside
        id="sidebar"
        class="flex w-64 shrink-0 flex-col border-r border-zinc-800 bg-zinc-950/40"
        style="display: none"
      >
        <div data-tauri-drag-region class="flex items-center gap-1 px-3 pb-1 pt-3">
          <span data-tauri-drag-region class="flex-1 text-xs font-medium text-zinc-400">
            历史会话
          </span>
          <button
            id="new-chat"
            title="新对话（⌘N）"
            class="rounded-md p-1 text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
          ></button>
        </div>
        <div class="px-2 pb-2">
          <input
            id="history-filter"
            class="w-full rounded-md bg-zinc-800/60 px-2 py-1 text-xs text-zinc-200 placeholder-zinc-500 outline-none"
            placeholder="筛选标题…"
            spellcheck="false"
          />
        </div>
        <ul id="conversations" class="min-h-0 flex-1 space-y-0.5 overflow-y-auto px-2 pb-2"></ul>
      </aside>

      <!-- 右栏：当前会话 -->
      <section class="flex min-w-0 flex-1 flex-col">
        <header
          data-tauri-drag-region
          class="flex items-center justify-between gap-2 border-b border-zinc-800 px-4 py-2 text-sm text-zinc-300"
        >
          <div class="flex min-w-0 flex-1 items-center gap-1">
            <button
              id="toggle-sidebar"
              title="历史面板（⌘B）"
              class="rounded-md p-1 text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
            ></button>
            <div id="history-button-wrap" class="relative">
              <button
                id="history-button"
                title="最近会话（悬停展开）"
                class="rounded-md p-1 text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
              ></button>
              <div
                id="history-menu"
                class="absolute left-0 top-full z-20 mt-1 hidden w-72 overflow-hidden rounded-lg border border-zinc-700/60 bg-zinc-900/95 p-1 shadow-2xl backdrop-blur-xl"
              >
                <div class="px-2 py-1 text-[10px] uppercase tracking-wide text-zinc-500">
                  最近会话（⌃[ / ⌃] 切换）
                </div>
                <ul id="history-menu-list" class="max-h-72 overflow-y-auto"></ul>
              </div>
            </div>
            <span
              id="chat-title"
              data-tauri-drag-region
              class="min-w-0 flex-1 truncate font-medium"
            >
              AI 对话
            </span>
          </div>
          <button
            id="close"
            title="收起（Esc）"
            class="rounded-md p-1 text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
          ></button>
        </header>
        <main id="messages" class="min-h-0 flex-1 space-y-4 overflow-y-auto px-4 py-4"></main>
        <div id="empty" class="hidden px-4 pb-2 text-xs text-zinc-500"></div>
        <div
          id="error"
          class="hidden border-t border-red-500/30 bg-red-500/10 px-4 py-2 text-xs text-red-200"
        ></div>
        <div id="attach-row" class="hidden">
          <input
            id="attach-path"
            class="min-w-0 flex-1 bg-transparent text-zinc-100 placeholder-zinc-500 outline-none"
            placeholder="粘贴文件路径，Enter 添加附件（Esc 取消；支持 ~ 与空格路径）"
            spellcheck="false"
          />
          <span id="attach-msg" class="shrink-0"></span>
        </div>
        <footer class="border-t border-zinc-800 p-2">
          <textarea
            id="composer"
            rows="3"
            placeholder="继续对话…（Enter 发送，Shift+Enter 换行）"
            spellcheck="false"
            class="w-full resize-none bg-transparent px-2 py-1 text-sm text-zinc-100 placeholder-zinc-500 outline-none"
          ></textarea>
          <div class="flex items-center justify-between px-1">
            <button
              id="attach"
              title="添加附件（路径输入）"
              class="flex items-center gap-1 rounded-md px-2 py-1 text-xs text-zinc-400 hover:bg-zinc-700/60 hover:text-zinc-100"
            ></button>
            <button id="send" class="flex items-center gap-1 rounded-md px-3 py-1 text-xs"></button>
          </div>
        </footer>
      </section>
    </div>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
