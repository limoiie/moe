name: Refresh model catalog

# Regenerates crates/moe-platform/data/models-catalog.json from models.dev and
# opens a PR with the diff. Free for public repos; needs no secrets.
#
# Notes:
# - GitHub auto-disables scheduled workflows after ~60 days without repository
#   activity; run this workflow manually (workflow_dispatch) to re-enable it.
# - Creating the PR needs "Allow GitHub Actions to create and approve pull
#   requests" enabled under Settings → Actions → General → Workflow permissions
#   (the job-level permissions below cover the rest).
on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-model-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the embedded snapshot
        run: bash scripts/refresh-models-catalog.sh

      - name: Open or update the refresh PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-model-catalog
          delete-branch: true
          add-paths: crates/moe-platform/data/models-catalog.json
          commit-message: "chore: refresh model catalog snapshot"
          title: "chore: refresh model catalog snapshot"
          body: |
            Automated refresh of the embedded model catalog, generated by
            `scripts/refresh-models-catalog.sh` from
            [models.dev](https://models.dev/api.json) (MIT licence).

            The snapshot covers the official providers and the fields the
            provider/model picker needs; the runtime refresh (MOE-0016) fetches
            the full catalog over HTTP with an ETag check.

            Review the diff for unexpectedly missing providers or models before
            merging.
